name: Sync download release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-release-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android APK signature verifier
        run: sdkmanager --install "build-tools;36.0.0"
      - name: Download platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/aaki-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'aaki-marine-setup.exe' \
            --pattern 'aaki-marine.apk' \
            --dir "$RUNNER_TEMP/aaki-release"
      - name: Verify Android APK signature
        id: apk-signature
        run: |
          apksigner verify --verbose --print-certs "$RUNNER_TEMP/aaki-release/aaki-marine.apk" \
            | tee "$RUNNER_TEMP/apk-signature.txt"
          fingerprint=$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt" | awk -F': ' '{print $2}')
          subject=$(grep -m1 'Signer #1 certificate DN:' "$RUNNER_TEMP/apk-signature.txt" | awk -F': ' '{print $2}')
          test -n "$fingerprint"
          test -n "$subject"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
      - name: Generate checksums and release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          AAKI_ANDROID_SIGNER_FINGERPRINT: ${{ steps.apk-signature.outputs.fingerprint }}
          AAKI_ANDROID_SIGNER_SUBJECT: ${{ steps.apk-signature.outputs.subject }}
        run: |
          node scripts/create-release-manifest.js \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/aaki-release/release-manifest.json" \
            "$RUNNER_TEMP/aaki-release/aaki-marine-setup.exe" \
            "$RUNNER_TEMP/aaki-release/aaki-marine.apk"
      - name: Attach release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/aaki-release/release-manifest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
